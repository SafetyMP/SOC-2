name: Feature Request
description: Propose a catalog, sensor, or pack capability
title: "[feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Read the [design pivot](https://github.com/SafetyMP/SOC-2/blob/main/docs/DESIGN-PIVOT.md) before filing.
        SOC-2 stays a readiness-sensor pack — proposals that imply a GRC product,
        certification, or a new factory program should say so explicitly.

  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - catalog
        - policies (Rego)
        - sensors (GitHub / Terraform / procedural)
        - engine / scorer / waivers
        - evidence / locker
        - scripts / verify / CI
        - docs
        - Unsure / needs triage
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: What problem does this solve for the sensor pack or factory hand-off?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: High-level approach; link DESIGN-PIVOT or an issue if applicable
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Optional

  - type: checkboxes
    id: scope
    attributes:
      label: Scope checklist
      options:
        - label: I understand SOC-2 is a readiness-sensor pack, not a SOC 2 certification or CPA opinion
          required: true
        - label: I am willing to include tests or verify.sh updates if applicable
          required: false

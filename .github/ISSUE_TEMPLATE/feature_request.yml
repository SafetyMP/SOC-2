name: Feature request
description: Propose an improvement to local assessment, finding review, or the policy library
title: "[feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Start with the [project overview](https://github.com/SafetyMP/SOC-2#readme) and [documentation map](https://github.com/SafetyMP/SOC-2/blob/main/docs/README.md).
        Describe the user's problem and the evidence needed to know the improvement works. Keep all examples synthetic.
  - type: dropdown
    id: component
    attributes:
      label: Area
      options:
        - Browser workspace or review workflow
        - Local GitHub assessment
        - Catalog, policies, or sensors
        - Local evidence or privacy boundaries
        - Verification or contributor experience
        - Documentation or discovery
        - Unsure
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: Who encounters the problem, and what are they trying to do?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the desired outcome, scope, and how it could be verified.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives and data implications
      description: Include alternatives considered and any new provider permissions, data storage, or external services the proposal would require.
  - type: checkboxes
    id: scope
    attributes:
      label: Scope
      options:
        - label: I understand that readiness checks do not provide SOC 2 certification or an audit opinion.
          required: true
        - label: My examples contain no real assessment exports, credentials, or private evidence.
          required: true

name: Bug Report
description: Report a defect in catalog, Rego, sensors, or verify
title: "[bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Include commands you ran and their output when possible.
        SOC-2 is a readiness-sensor pack, not a certification — see [SECURITY.md](https://github.com/SafetyMP/SOC-2/blob/main/SECURITY.md).

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Clear description of the bug
      placeholder: ./scripts/verify.sh fails at the IaC warn gate...
    validations:
      required: true

  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - catalog
        - policies (Rego)
        - sensors (GitHub / Terraform / procedural)
        - engine / scorer / waivers
        - evidence / locker
        - scripts / verify / CI
        - docs
        - Other
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Commands or workflow steps
      placeholder: |
        1. ./scripts/verify.sh
        2. python3 -m engine.run
        3. …
      render: shell
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs or output
      description: Paste relevant stderr, CI link, or JSON result
      render: shell

  - type: dropdown
    id: environment
    attributes:
      label: Environment
      options:
        - Local (./scripts/verify.sh)
        - Docker (demo locker)
        - GitHub Actions CI
        - Other
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Branch, commit, or release tag
      placeholder: main, abc1234

name: iac-gate

# L7 enforcement gate (design §12). Runs the Rego policy library over the
# sample Terraform plan in WARN mode (reports, does not block) — the burn-in
# posture. Promote a gate to BLOCK by changing the mode to `enforce` once it
# shows a sustained clean signal.

on:
  push:
    branches: [main]
    paths: ["terraform-examples/**", "policies/**", "sensors/terraform.py", "scripts/iac_gate.sh"]
  pull_request:
    branches: [main]
    paths: ["terraform-examples/**", "policies/**", "sensors/terraform.py", "scripts/iac_gate.sh"]

permissions:
  contents: read

jobs:
  iac-policy-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with: { terraform_version: "1.5.7" }
      - name: Install OPA
        run: |
          set -euo pipefail
          curl -fsSL -o opa https://github.com/open-policy-agent/opa/releases/download/v1.20.2/opa_linux_amd64_static
          echo "69da5179ee403d10fa11bab6cfb4ffb0d23dba5f9b682fa977db772a1da5670f  opa" | sha256sum -c -
          chmod +x opa && sudo mv opa /usr/local/bin/opa
      - name: Run IaC gate (warn)
        run: bash scripts/iac_gate.sh warn

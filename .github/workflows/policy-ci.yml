name: policy-ci

# Phase 0 policy gate. Validates the Rego library + catalog. This runs in
# "warn" posture per readiness-layer-design.md §12 — it reports and fails CI on
# malformed policy, but does NOT block production deploys yet. The conftest IaC
# enforcement gate (pre-apply) ships with Phase 1 alongside Terraform.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate-policies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install OPA
        run: |
          set -euo pipefail
          curl -fsSL -o opa https://github.com/open-policy-agent/opa/releases/download/v1.20.2/opa_linux_amd64_static
          echo "69da5179ee403d10fa11bab6cfb4ffb0d23dba5f9b682fa977db772a1da5670f  opa" | sha256sum -c -
          chmod +x opa && sudo mv opa /usr/local/bin/opa
          opa version

      - name: Format check
        run: opa fmt --fail policies/

      - name: Compile check
        run: opa check policies/

      - name: Unit tests
        run: opa test policies/

  validate-catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install PyYAML
        run: pip install --quiet -r requirements.txt
      - name: Validate catalog + cross-reference Rego packages
        run: python3 scripts/validate_catalog.py
      - name: Python unit tests
        run: |
          set -euo pipefail
          for t in engine/test_*.py evidence/test_*.py sensors/test_*.py; do
            python3 "$t"
          done

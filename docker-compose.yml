# Optional development evidence locker; not used by the real GitHub workflow.
# Known demo credentials are for local experiments only. No production custody,
# independent signing, remote replica, or public transparency service is provided.
# Start explicitly with `docker compose up -d`; verification never starts Docker.
# S3 API: http://127.0.0.1:9000; console: http://127.0.0.1:9001.
# See evidence/README.md for the reference implementation's limitations.

services:
  minio:
    # Docker Hub deleted minio/minio. This digest started the four-drive command below.
    image: pgsty/silo@sha256:635197cb9f36d01bee221d34d1c7d7960f6a95c48b0b6c01d99cd13bdae51a46
    # Four development drives exercise the reference object-lock setup.
    # This does not establish production retention or custody guarantees.
    command: server /data{1...4} --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "127.0.0.1:9000:9000"   # S3 API
      - "127.0.0.1:9001:9001"   # web console
    volumes:
      - minio-data1:/data1
      - minio-data2:/data2
      - minio-data3:/data3
      - minio-data4:/data4

  locker-init:
    # Same image: it has /bin/sh and mc. Docker Hub deleted minio/mc.
    image: pgsty/silo@sha256:635197cb9f36d01bee221d34d1c7d7960f6a95c48b0b6c01d99cd13bdae51a46
    depends_on:
      - minio
    entrypoint: /bin/sh
    command:
      - -c
      - |
        set -e
        echo "Waiting for MinIO..."
        until mc alias set local http://minio:9000 minioadmin minioadmin >/dev/null 2>&1; do
          sleep 2
        done
        mc mb --ignore-existing --with-lock local/evidence
        mc retention set --default governance 365d local/evidence
        # evidence-writer: put/get only, never DeleteObject (prevents delete-marker hiding).
        mc admin user add local evidence-writer writer-pass-dev-only 2>/dev/null || true
        printf '%s' '{"Version":"2012-10-17","Statement":[{"Effect":"Allow","Action":["s3:PutObject","s3:GetObject","s3:GetObjectVersion","s3:ListBucket"],"Resource":["arn:aws:s3:::evidence","arn:aws:s3:::evidence/*"]},{"Effect":"Deny","Action":["s3:DeleteObject","s3:DeleteObjectVersion"],"Resource":["arn:aws:s3:::evidence/*"]}]}' > /tmp/writer-policy.json
        mc admin policy create local evidence-writer-policy /tmp/writer-policy.json 2>/dev/null || mc admin policy add local evidence-writer-policy /tmp/writer-policy.json 2>/dev/null || true
        mc admin policy attach local evidence-writer-policy --user evidence-writer 2>/dev/null || true
        echo "Locker ready: bucket=local/evidence object-lock=governance(365d) writer=evidence-writer (no DeleteObject)"
        mc version info local/evidence
        mc retention info local/evidence

volumes:
  minio-data1:
  minio-data2:
  minio-data3:
  minio-data4:
